<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Solmaris — coastal sunset open-world crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1230; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #eef1f5; z-index: 5; }
  #hud-top-left { position: absolute; top: 14px; left: 16px; }
  #hud-cash { font-size: 30px; font-weight: 800; color: #7dff8a; text-shadow: 0 2px 6px rgba(0,0,0,.7); }
  #hud-health { width: 180px; height: 12px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.35); border-radius: 6px; margin-top: 6px; overflow: hidden; }
  #hud-health-fill { height: 100%; width: 100%; background: #4caf50; }
  #hud-hint { margin-top: 8px; font-size: 12px; color: rgba(255,255,255,.75); text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  #hud-top-right { position: absolute; top: 14px; right: 16px; text-align: right; }
  #hud-wanted { font-size: 26px; letter-spacing: 4px; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  #hud-spotted-wrap { display: none; margin-top: 6px; font-size: 11px; letter-spacing: 2px; color: #ffe9a8; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  #hud-spotted { width: 150px; height: 10px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.35); border-radius: 5px; overflow: hidden; margin-left: auto; }
  #hud-spotted-fill { height: 100%; width: 0%; background: #ffb300; }
  #hud-mission { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); text-align: center; max-width: 560px; }
  #hud-mission-title { font-size: 15px; font-weight: 800; letter-spacing: 1px; color: #ffe14d; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  #hud-mission-text { font-size: 14px; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.85); margin-top: 2px; }
  #hud-speed { position: absolute; right: 18px; bottom: 200px; font-size: 24px; font-weight: 700; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  #hud-minimap { position: absolute; left: 16px; bottom: 16px; border: 2px solid rgba(255,255,255,.4); border-radius: 8px; background: #20242e; box-shadow: 0 4px 16px rgba(0,0,0,.5); }
  #hud-crosshair { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font-size: 26px; font-weight: 800; color: rgba(255,255,255,.9); text-shadow: 0 0 4px #000; display: none; }
  #hud-toast { position: absolute; left: 50%; bottom: 210px; transform: translateX(-50%); font-size: 17px; font-weight: 700; color: #ffe14d; text-shadow: 0 2px 6px rgba(0,0,0,.9); opacity: 0; transition: opacity .3s; white-space: nowrap; }
  #hud-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(10,6,28,.55); text-align: center; padding: 20px; }
  #hud-overlay-title { font-size: 72px; font-weight: 900; letter-spacing: 10px; color: #ffb347; text-shadow: 0 4px 24px rgba(0,0,0,.9); }
  #hud-overlay-sub { font-size: 17px; max-width: 560px; margin-top: 10px; line-height: 1.5; text-shadow: 0 2px 6px rgba(0,0,0,.9); }
  #hud-overlay-hint { font-size: 15px; margin-top: 26px; color: #ffe14d; font-weight: 700; text-shadow: 0 2px 6px rgba(0,0,0,.9); }
</style>
<script type="importmap">
{ "imports": { "three": "../vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game" aria-label="Solmaris: a coastal sunset open-world crime game. Drive, steal cars, run missions and lose the police."></canvas>
<div id="hud"></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
